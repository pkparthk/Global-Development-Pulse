services:
  - type: web
    name: global-development-pulse-backend
    env: python
    region: oregon
    # Install requirements from backend/requirements.txt
    buildCommand: python -m pip install -r backend/requirements.txt
    # Run migrations and collect static files, then start Gunicorn
    startCommand: cd backend ; python manage.py migrate --noinput ; python manage.py collectstatic --noinput ; gunicorn project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DJANGO_SETTINGS_MODULE
        value: project.settings
